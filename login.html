<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — ERP Manufaktur</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:"Segoe UI",Arial,Helvetica,sans-serif;background:#f5f7fb;color:#17233d}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-shell{width:100%;max-width:430px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:48px;height:48px;border-radius:12px;background:#0b1c3f;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 18px rgba(11,28,63,.15)}
.logo svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.brand-title{font-weight:800;font-size:18px;color:#14233f}
.brand-sub{font-size:11px;color:#7b899d;margin-top:3px}
.card{background:#fff;border:1px solid #e3e8f0;border-radius:12px;box-shadow:0 12px 30px rgba(35,50,80,.08);padding:25px}
h1{font-size:22px;color:#14233f;margin-bottom:6px}
.subtitle{font-size:11px;color:#7b899d;line-height:1.5;margin-bottom:22px}
.field{margin-bottom:14px}
label{display:block;font-size:10px;font-weight:700;color:#657289;text-transform:uppercase;letter-spacing:.2px;margin-bottom:6px}
input{width:100%;height:42px;border:1px solid #d9e0ea;border-radius:7px;padding:0 12px;font-size:13px;color:#34435b;outline:none;font-family:inherit}
input:focus{border-color:#6f8de4;box-shadow:0 0 0 3px rgba(46,91,215,.08)}
button{width:100%;height:42px;border:0;border-radius:7px;background:#2e5bd7;color:#fff;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 3px 8px rgba(46,91,215,.22)}
button:hover{background:#244dbd}
button:disabled{opacity:.6;cursor:not-allowed}
.status{display:none;margin-bottom:14px;padding:10px 12px;border-radius:7px;font-size:10px;line-height:1.4}
.status.error{display:block;background:#fdebed;border:1px solid #f4cbd0;color:#a83e47}
.status.info{display:block;background:#eef5ff;border:1px solid #cfe0ff;color:#315783}
.note{margin-top:16px;text-align:center;font-size:9px;color:#8995a7;line-height:1.5}
.footer{margin-top:14px;text-align:center;font-size:9px;color:#9aa5b5}
</style>
</head>
<body>
<div class="login-shell">
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 48 48"><path d="M5 42V24h9v18M14 42V17h9v25M23 42V8h9v34M32 42V22h11v20"/><path d="M4 42h40"/><path d="M27 8l5-5 5 5"/></svg></div>
    <div><div class="brand-title">PT. Manufaktur Indonesia</div><div class="brand-sub">Manufacturing Management</div></div>
  </div>
  <div class="card">
    <h1>Masuk ke ERP</h1>
    <div class="subtitle">Gunakan akun yang terdaftar pada Master User untuk mengakses dashboard manufaktur.</div>
    <div id="status" class="status"></div>
    <form id="loginForm">
      <div class="field"><label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" required autofocus placeholder="Masukkan username"></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Masukkan password"></div>
      <button id="loginBtn" type="submit">Masuk</button>
    </form>
    <div class="note">Kredensial diproses oleh server Apps Script. Password tidak disimpan di GitHub.</div>
  </div>
  <div class="footer">ERP Manufaktur • GitHub Pages Frontend</div>
</div>
<script>
'use strict';
const API_BASE_URL = 'https://script.google.com/macros/s/AKfycbz46NNkDXdvr1Y6jks48R-nL__xBtMZx1YlDmfz19oOKAkU3FX3MwmmiDI_0qqzHlkQ/exec';
const SESSION_STORAGE_KEY = 'erp_manufaktur_session';
function showStatus(message, type) {
  const el = document.getElementById('status');
  el.className = 'status ' + (type || 'error');
  el.textContent = message;
}
function clearStatus() {
  const el = document.getElementById('status');
  el.className = 'status';
  el.textContent = '';
}
function apiLogin(username, password) {
  return fetch(API_BASE_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:'apiLogin',token:'',args:[username,password]})
  }).then(function(r){
    return r.text().then(function(raw){
      let d;
      try{d=JSON.parse(raw)}catch(e){throw new Error('Respons API bukan JSON yang valid.')}
      if(!r.ok || !d.success) throw new Error(d.error || 'Login gagal.');
      return d.data;
    });
  });
}
document.getElementById('loginForm').addEventListener('submit',function(e){
  e.preventDefault();
  clearStatus();
  const btn=document.getElementById('loginBtn');
  const username=document.getElementById('username').value.trim();
  const password=document.getElementById('password').value;
  btn.disabled=true; btn.textContent='Memverifikasi...';
  apiLogin(username,password).then(function(res){
    localStorage.setItem(SESSION_STORAGE_KEY,JSON.stringify({token:res.token,username:res.username,role:res.role,nama:res.nama}));
    window.location.href='index.html';
  }).catch(function(err){
    showStatus(err && err.message ? err.message : String(err),'error');
    btn.disabled=false; btn.textContent='Masuk';
  });
});
</script>
</body>
</html>
